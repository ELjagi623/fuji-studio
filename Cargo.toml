[workspace]
resolver = "2"
members = ["crates/fuji-ptp", "crates/raf", "crates/fujictl", "app/src-tauri"]

# Decode thumbnails at full speed even in debug builds
[profile.dev.package."*"]
opt-level = 3

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
